<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR Capital · Apartment Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1a3254 100%);
      color: #fff; padding: 32px 48px 28px;
      border-bottom: 3px solid #2563eb;
    }
    .header-inner { max-width: 1100px; margin: 0 auto; }
    .brand { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #64748b; margin-bottom: 8px; }
    header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
    header p  { font-size: .8rem; color: #94a3b8; margin-top: 6px; }

    .container { max-width: 1100px; margin: 0 auto; padding: 48px 48px 80px; }

    .section-label {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: #94a3b8; margin-bottom: 20px;
    }

    .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .prop-card {
      display: block; text-decoration: none; color: inherit;
      background: #fff; border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
    }
    .prop-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.12); }

    .card-top { height: 6px; background: var(--c, #2563eb); }
    .card-body { padding: 28px 28px 22px; }

    .card-eyebrow {
      font-size: .63rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--c, #2563eb); margin-bottom: 10px;
    }
    .card-name { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; letter-spacing: -.02em; }
    .card-addr { font-size: .75rem; color: #64748b; margin-bottom: 20px; }

    .card-stats { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid #f1f5f9; border-radius: 8px; overflow: hidden; }
    .card-stat { flex: 1; padding: 12px 14px; border-right: 1px solid #f1f5f9; }
    .card-stat:last-child { border-right: none; }
    .card-stat-label { font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin-bottom: 3px; }
    .card-stat-val   { font-size: .95rem; font-weight: 800; color: #0f172a; }

    .card-data-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; background: #f8fafc; border-radius: 8px;
      font-size: .75rem; gap: 8px;
    }
    .data-loading { color: #94a3b8; font-style: italic; font-size: .72rem; }
    .data-rent { font-weight: 700; color: #0f172a; }
    .data-occ  { font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .occ-hi  { background: #dcfce7; color: #15803d; }
    .occ-mid { background: #fef9c3; color: #92400e; }
    .occ-lo  { background: #fee2e2; color: #b91c1c; }

    .card-footer {
      padding: 14px 28px;
      border-top: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between;
    }
    .comp-count { font-size: .72rem; color: #64748b; }
    .view-btn {
      font-size: .72rem; font-weight: 700;
      color: var(--c, #2563eb);
      padding: 5px 14px; border-radius: 20px;
      border: 1.5px solid var(--c, #2563eb);
      background: transparent;
      transition: background .12s, color .12s;
    }
    .prop-card:hover .view-btn { background: var(--c, #2563eb); color: #fff; }

    .snapshot-strip {
      margin-top: 40px; background: #fff; border-radius: 12px;
      padding: 18px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .snapshot-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; white-space: nowrap; }
    .snapshot-badges { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .snap-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #f1f5f9; border-radius: 20px;
      padding: 4px 11px; font-size: .71rem; font-weight: 600; color: #334155;
    }
    .snap-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .snap-date { font-size: .67rem; color: #94a3b8; white-space: nowrap; }

    footer { text-align: center; padding: 24px; font-size: .72rem; color: #94a3b8; }

    @media (max-width: 720px) {
      .prop-grid { grid-template-columns: 1fr; }
      .container, header { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">CR Capital</div>
    <h1>Apartment Portfolio</h1>
    <p id="headerSub">Loading portfolio data…</p>
  </div>
</header>

<div class="container">
  <div class="section-label">Subject Properties — click to open comp dashboard</div>
  <div class="prop-grid" id="propGrid"></div>

  <div class="snapshot-strip" id="snapshotStrip" style="display:none">
    <span class="snapshot-label">Latest Snapshot</span>
    <div class="snapshot-badges" id="snapshotBadges"></div>
    <span class="snap-date" id="snapDate"></span>
  </div>
</div>

<footer>Data sourced from property websites · Updated daily · CR Capital</footer>

<script>
const PORTFOLIO = [
  {
    id: 'lexington', name: "Lexington at Champions", shortName: "Lexington",
    address: "5007 FM 1960 W, Houston, TX 77069", market: "NW Houston, TX",
    yearBuilt: 2003, totalUnits: 89, color: '#2563eb',
    compIds: ['marquis','greenwood','northchase','stablechase','cypress_creek']
  },
  {
    id: 'captains_landing', name: "Captain's Landing", shortName: "Captain's Landing",
    address: "3102 69th St, Galveston, TX 77551", market: "Galveston Island, TX",
    yearBuilt: 1983, totalUnits: 390, color: '#0ea5e9',
    compIds: ['village_by_the_sea','west_beach']
  },
];

(async () => {
  let history = [];
  try {
    const r = await fetch('./data/history.json?_=' + Date.now());
    history = await r.json();
  } catch { history = []; }

  const latest    = history.length ? history[history.length - 1] : null;
  const units     = latest ? (latest.units || []) : [];
  const snapCount = history.length;
  const snapDate  = latest
    ? new Date(latest.date + 'T12:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })
    : null;

  document.getElementById('headerSub').textContent =
    PORTFOLIO.length + ' properties · ' + snapCount + ' daily snapshot' + (snapCount !== 1 ? 's' : '') +
    (snapDate ? ' · Last updated ' + snapDate : '');

  const grid = document.getElementById('propGrid');
  grid.innerHTML = PORTFOLIO.map(p => {
    const propUnits = units.filter(u => u.prop === p.id && u.rent);
    const rents     = propUnits.map(u => u.rent);
    const rentStr   = rents.length
      ? '$' + Math.min(...rents).toLocaleString() + ' – $' + Math.max(...rents).toLocaleString() + '/mo'
      : null;
    const avail = units.filter(u => u.prop === p.id).reduce((s,u) => s + (u.count ?? 0), 0);
    const occ   = p.totalUnits && rents.length ? Math.round((p.totalUnits - avail) / p.totalUnits * 100) : null;
    const occCls = occ == null ? '' : occ >= 93 ? 'occ-hi' : occ >= 85 ? 'occ-mid' : 'occ-lo';

    const dataRow = rentStr
      ? '<div class="card-data-row"><span class="data-rent">' + rentStr + '</span>' +
        (occ != null ? '<span class="data-occ ' + occCls + '">' + occ + '% Implied Occ.</span>' : '') + '</div>'
      : '<div class="card-data-row"><span class="data-loading">No snapshot data yet — trigger a scrape run to populate</span></div>';

    return '<a class="prop-card" href="index.html?id=' + p.id + '" style="--c:' + p.color + '">' +
      '<div class="card-top"></div>' +
      '<div class="card-body">' +
        '<div class="card-eyebrow">★ Subject Property</div>' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-addr">' + p.address + '</div>' +
        '<div class="card-stats">' +
          '<div class="card-stat"><div class="card-stat-label">Total Units</div><div class="card-stat-val">' + p.totalUnits + '</div></div>' +
          '<div class="card-stat"><div class="card-stat-label">Year Built</div><div class="card-stat-val">' + p.yearBuilt + '</div></div>' +
          '<div class="card-stat"><div class="card-stat-label">Comps</div><div class="card-stat-val">' + p.compIds.length + '</div></div>' +
          '<div class="card-stat"><div class="card-stat-label">Market</div><div class="card-stat-val" style="font-size:.78rem;line-height:1.25">' + p.market + '</div></div>' +
        '</div>' +
        dataRow +
      '</div>' +
      '<div class="card-footer"><span class="comp-count">' + p.compIds.length + ' competitor propert' + (p.compIds.length !== 1 ? 'ies' : 'y') + ' tracked</span>' +
      '<span class="view-btn">Open Dashboard →</span></div>' +
    '</a>';
  }).join('');

  if (snapCount > 0) {
    document.getElementById('snapshotStrip').style.display = '';
    document.getElementById('snapshotBadges').innerHTML = PORTFOLIO.map(p => {
      const hasData = units.some(u => u.prop === p.id);
      return '<span class="snap-badge"><span class="snap-dot" style="background:' + p.color + (hasData ? '' : '55') + '"></span>' +
        p.shortName + (hasData ? '' : ' <span style="color:#94a3b8;font-weight:400;font-size:.65rem">(no data yet)</span>') + '</span>';
    }).join('');
    document.getElementById('snapDate').textContent = snapDate ? 'as of ' + snapDate : '';
  }
})();
</script>
</body>
</html>
